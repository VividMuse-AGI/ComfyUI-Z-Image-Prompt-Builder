[project]
name = "ComfyUI-Z-Image-Prompt-Builder"
version = "0.1.0"
description = "A concise Chinese portrait prompt builder with deterministic random combinations and recommended canvas sizes for Z-Image in ComfyUI."
authors = [{ name = "VividMuse" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/VividMuse-AGI/ComfyUI-Z-Image-Prompt-Builder"
Documentation = "https://github.com/VividMuse-AGI/ComfyUI-Z-Image-Prompt-Builder#readme"
"Bug Tracker" = "https://github.com/VividMuse-AGI/ComfyUI-Z-Image-Prompt-Builder/issues"

[tool.comfy]
PublisherId = "VividMuse"
DisplayName = "Z-Image 中文提示词生成器"
requires-comfyui = ">=0.31.1"

[tool.ruff]
line-length = 100
target-version = "py310"
