name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python and parse phrase libraries
        run: |
          python -m py_compile nodes.py modular_nodes.py __init__.py
          python -c "import glob,json; [json.load(open(path, encoding='utf-8')) for path in glob.glob('phrase_library/*.json')]"
      - name: Run Python regressions
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify generated frontend translation catalog
        run: |
          python scripts/generate_frontend_i18n.py
          git diff --exit-code -- web/js/i18n_catalog.js
      - name: Run frontend regressions
        run: |
          for source in web/js/*.js; do node --check "$source"; done
          for test in tests/frontend_*.mjs; do node "$test"; done
