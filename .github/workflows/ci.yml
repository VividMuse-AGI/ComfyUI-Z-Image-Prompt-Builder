name: test

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python and parse JSON catalogs
        run: |
          python -m py_compile nodes.py prompt_catalog.py prompt_resolver.py prompt_render_zh.py prompt_render_en.py modular_nodes.py resolution.py reference_pool.py txt_selection.py prompt_diagnostics.py framing.py combination_coherence.py __init__.py
          python -c "import glob,json; [json.load(open(path, encoding='utf-8')) for path in [*glob.glob('phrase_library/*.json'), *glob.glob('web/js/data/*.json')]]"
      - name: Run Python regressions
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify generated frontend translation catalog
        run: |
          python scripts/generate_frontend_i18n.py
          git diff --exit-code -- web/js/data/i18n_catalog.json
      - name: Verify generated resolution catalog
        run: |
          python scripts/generate_resolution_catalog.py
          git diff --exit-code -- web/js/lib/resolution_catalog.mjs
      - name: Verify searchable library catalog
        run: |
          python scripts/generate_library_catalog.py
          git diff --exit-code -- web/js/data/library_catalog.json
      - name: Verify generated prompt schema catalog
        run: |
          python scripts/generate_prompt_schema_catalog.py
          git diff --exit-code -- web/js/lib/prompt_schema_catalog.mjs
      - name: Verify generated workflow examples
        run: |
          python scripts/generate_workflow_examples.py
          git diff --exit-code -- examples/
      - name: Run frontend regressions
        run: |
          test "$(find web/js -name '*.js' | wc -l)" -eq 1
          node --check web/js/index.js
          for source in web/js/lib/*.mjs; do node --check "$source"; done
          for test in tests/frontend_*.mjs; do node "$test"; done
